simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"
lps_mqtt_python_image: "jadkhaddad/lps-mqtt-python:0.1.0"

seed: 4

devices:
  devices_count: 1
  max_event_interval: 1s
  min_event_interval: 1s
  retry_duration: 250ms
  max_events: 2
  wait_before_start: 10s

server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080
  failure_rate: 0.0
  max_work_duration: 0s
  max_response_duration: 0s
  shutdown_after_idle_duration: 20s
  server_count: 1
  deduplication: True

amqp:
  queues_count: 2
  producers:
    producers_count: 1
    socket_addr: 0.0.0.0:5672
  consumers:
    http_timeout: 30s
    consumers_count: 2
    reconnect_duration: 1ms
    server_proxy:
      socket_addr: 0.0.0.0:9081
      connection:
        failure_rate: 0.0
        max_up_duration: 1d
        min_up_duration: 1d
        latency: # Request is 411 bytes => 411 bytes x 10ms = 4110ms = 4.110s
          max_upstream_latency: 10ms

# python3 runner/runner.py --protocol "amqp" --runs 60 --base-dir ".simulations/alps/alps-iod" --base-config ".simulations/alps/alps-iod/simulation-config.yaml" --log-dir ".simulations/alps/alps-iod/logs"