    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: lps-rabbitmq
    command: bash -c " rabbitmq-plugins enable --offline rabbitmq_consistent_hash_exchange && rabbitmq-server "
    networks:
    - lps-net
    restart: unless-stopped
  scripts:
    image: jadkhaddad/lps-scripts:0.1.0
    container_name: lps-scripts
    command: sh -c 'python3 /scripts/latency.py server-results.json latency-line.png && python3 /scripts/failure.py device-results.json server-results.json failure.png'
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/.simulations/alps/no-features/ubuntu/alps-real-no-errors/simulation-33/mount:/app
  server:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server
    command: gs-prod-workload-server --config-file /app/server-config.yaml
    environment:
      RUST_LOG: gs_prod_workload_server=debug
    networks:
    - lps-net
    ports:
    - 0.0.0.0:8080:8080
    volumes:
    - /home/jadkhaddad/Desktop/LPS/.simulations/alps/no-features/ubuntu/alps-real-no-errors/simulation-33/mount:/app
