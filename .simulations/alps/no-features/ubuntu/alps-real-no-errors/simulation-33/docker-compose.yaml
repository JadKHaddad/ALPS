networks:
  lps-net:
    external: true
    name: lps-simulation-net
services:
  ars-comp-1-proxy-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-1-proxy-0
    command: sh -c "mkdir -p logs && exec python3 /scripts/ars_comp_1_proxy.py"
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-1-proxy-0
      TARGET_URL: http://lps-producer-0:5672/work
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/.simulations/alps/no-features/ubuntu/alps-real-no-errors/simulation-33/mount:/app
    restart: unless-stopped
  ars-comp-1-proxy-1:
