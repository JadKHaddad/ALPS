simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"

devices:
  devices_count: 50
  max_event_interval: 5s
  min_event_interval: 5s
  max_events: 60
  retry_duration: 500ms
  wait_before_start: 3s

server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080
  # Not used because of `use_gs_prod_workload` but needed for the deserialization of the config file
  failure_rate: 0.0
  shutdown_after_idle_duration: 5s
  server_count: 3
  use_gs_prod_workload: True 
  background_load_per_second: 70
  deduplication: True 

amqp:
  queues_count: 3
  producers:
    producers_count: 3
    socket_addr: 0.0.0.0:5672
  consumers:
    consumers_count: 3
    reconnect_duration: 50ms
    amqp_proxy:
      socket_addr: 0.0.0.0:9090
      failure_rate: 0.2
      max_up_duration: 909s
      min_up_duration: 227s
    server_proxy:
      socket_addr: 0.0.0.0:9081
      failure_rate: 0.2
      max_up_duration: 48ms
      min_up_duration: 12ms

# python3 runner/runner.py --protocol "amqp" --start-index 36 --runs 60 --base-dir "simulations/alps/alps-real" --base-config "simulations/alps/alps-real/simulation-config.yaml"  --log-dir "simulations/alps/alps-real/logs"
# python3 runner/runner.py --protocol "amqp" --start-index 60 --runs 70 --base-dir "simulations/alps/alps-real" --base-config "simulations/alps/alps-real/simulation-config.yaml"  --log-dir "simulations/alps/alps-real/logs"