simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"
lps_mqtt_python_image: "jadkhaddad/lps-mqtt-python:0.1.0"

seed: 6

devices:
  devices_count: 1
  max_event_interval: 1ms
  min_event_interval: 1ms
  retry_duration: 250ms
  max_events: 1
  wait_before_start: 7500ms

server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080
  failure_rate: 0.0
  max_work_duration: 0s
  max_response_duration: 0s
  shutdown_after_idle_duration: 20s
  server_count: 1
  deduplication: True

amqp:
  queues_count: 1
  producers:
    producers_count: 1
    socket_addr: 0.0.0.0:5672
  consumers:
    consumers_count: 1
    reconnect_duration: 1ms
    server_proxy:
      socket_addr: 0.0.0.0:9081
      connection:
        failure_rate: 0.0
        max_up_duration: 1d
        min_up_duration: 1d
        latency:
          max_downstream_latency: 27ms   # 189 bytes x 27ms = 5103ms = 5.103s
    amqp_proxy:
      socket_addr: 0.0.0.0:9090
      connection:
        failure_rate: 0.0
        max_up_duration: 4s

