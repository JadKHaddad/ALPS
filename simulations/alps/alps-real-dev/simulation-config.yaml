simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"
lps_mqtt_python_image: "jadkhaddad/lps-mqtt-python:0.1.0"

devices:
  devices_count: 10
  max_event_interval: 100ms
  min_event_interval: 50ms
  max_events: 10
  retry_duration: 500ms
  wait_before_start: 5s

server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080
  # Not used because of `use_gs_prod_workload` but needed for the deserialization of the config file
  failure_rate: 0.2
  shutdown_after_idle_duration: 30s
  server_count: 3
  # use_gs_prod_workload: True 
  # background_load_per_second: 70
  # deduplication: True 
  tcp_proxy:
    socket_addr: 0.0.0.0:9000
    connection:
      failure_rate: 0.2
      max_up_duration: 1d
      min_up_duration: 1d

amqp:
  queues_count: 3
  producers:
    producers_count: 3
    socket_addr: 0.0.0.0:5672
  consumers:
    prefetch_count: 0
    consumers_count: 3
    reconnect_duration: 0ms
    amqp_proxy:
      socket_addr: 0.0.0.0:9090
      connection:
        failure_rate: 0.2
        max_up_duration: 1d
        min_up_duration: 1d
    server_proxy:
      socket_addr: 0.0.0.0:9081
      connection:
        failure_rate: 0.2
        max_up_duration: 1d
        min_up_duration: 1d

# python3 runner/runner.py --protocol "amqp" --runs 1 --base-dir "simulations/alps/alps-real-dev" --base-config "simulations/alps/alps-real-dev/simulation-config.yaml"  --log-dir "simulations/alps/alps-real-dev/logs"