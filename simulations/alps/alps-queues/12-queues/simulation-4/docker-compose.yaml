networks:
  lps-net:
    external: true
    name: lps-simulation-net
services:
  consumer-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumer-0
    command: consumer --config-file /app/consumer-0.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
    restart: unless-stopped
  consumer-1:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumer-1
    command: consumer --config-file /app/consumer-1.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
    restart: unless-stopped
  consumer-2:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumer-2
    command: consumer --config-file /app/consumer-2.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
    restart: unless-stopped
  consumers-server-proxy:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumers-server-proxy
    command: server-proxy --config-file /app/consumers-server-proxy-config.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
  device:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-device
    command: device --config-file /app/device-config.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
  producer-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-producer-0
    command: producer --config-file /app/producer-0.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
    restart: unless-stopped
  producer-1:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-producer-1
    command: producer --config-file /app/producer-1.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
    restart: unless-stopped
  producer-2:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-producer-2
    command: producer --config-file /app/producer-2.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management
    container_name: lps-rabbitmq
    command: bash -c " rabbitmq-plugins enable --offline rabbitmq_consistent_hash_exchange && rabbitmq-server "
    networks:
    - lps-net
    restart: unless-stopped
  scripts:
    image: jadkhaddad/lps-scripts:0.1.0
    container_name: lps-scripts
    command: sh -c 'python3 /scripts/latency.py server-results.json latency-line.png && python3 /scripts/failure.py device-results.json server-results.json failure.png'
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
  server:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server
    command: gs-prod-workload-server --config-file /app/server-config.yaml
    environment:
      RUST_LOG: gs_prod_workload_server=debug
    networks:
    - lps-net
    ports:
    - 0.0.0.0:8080:8080
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
  server-server-proxy-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server-server-proxy-0
    command: server-proxy --config-file /app/server-server-proxy-0.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
  server-server-proxy-1:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server-server-proxy-1
    command: server-proxy --config-file /app/server-server-proxy-1.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
  server-server-proxy-2:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server-server-proxy-2
    command: server-proxy --config-file /app/server-server-proxy-2.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
  validator:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-validator
    command: sh -c "validator --config-file /app/validator-config.yaml > /app/validator.log 2>&1"
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/alps/alps-queues/12-queues/simulation-4/mount:/app
