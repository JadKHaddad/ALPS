simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"

devices:
  devices_count: 50
  max_event_interval: 1s
  min_event_interval: 999ms
  max_events: 60
  retry_duration: 500ms
  use_six_digit_device_id: True
  wait_before_start: 10s

server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080
  failure_rate: 0.0
  shutdown_after_idle_duration: 15s
  server_count: 1
  max_work_duration: 2ns
  min_work_duration: 1ns
  max_response_duration: 2ns
  min_response_duration: 1ns

amqp:
  queues_count: 48
  producers:
    producers_count: 3
    socket_addr: 0.0.0.0:5672
  consumers:
    consumers_count: 3
    reconnect_duration: 50ms

# python3 runner/runner.py --protocol "amqp" --runs 1 --base-dir "simulations/alps/alps-queues/48-queues" --base-config "simulations/alps/alps-queues/48-queues/simulation-config.yaml"  --log-dir "simulations/alps/alps-queues/48-queues/logs"