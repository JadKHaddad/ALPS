networks:
  lps-net:
    external: true
    name: lps-simulation-net
services:
  ars-comp-1-proxy-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-1-proxy-0
    command: python3 /scripts/ars_comp_1_proxy.py
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-1-proxy-0
      TARGET_URL: http://lps-legacy-proxy-1-0:8080/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  ars-comp-2-proxy-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-2-proxy-0
    command: python3 /scripts/ars_comp_2_proxy.py
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-2-proxy-0
      TARGET_URL: http://lps-consumers-server-proxy:8080/work
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  ars-comp-2-proxy-1:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-2-proxy-1
    command: python3 /scripts/ars_comp_2_proxy.py
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-2-proxy-1
      TARGET_URL: http://lps-consumers-server-proxy:8080/work
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  consumer-server-proxy-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumer-server-proxy-0
    command: tcp-proxy --config-file /app/consumer-server-proxy-0-config.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  consumer-server-proxy-1:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumer-server-proxy-1
    command: tcp-proxy --config-file /app/consumer-server-proxy-1-config.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  consumers-server-proxy:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumers-server-proxy
    command: server-proxy --config-file /app/consumers-server-proxy-config.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
  device:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-device
    command: device --config-file /app/device-config.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
  hivemq:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: lps-hivemq
    networks:
    - lps-net
    ports:
    - 1883:1883
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount/mosquitto/config:/mosquitto/config
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
  legacy-proxy-1-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-1-0
    command: python3 /scripts/legacy_proxy_1.py
    environment:
      HTTP_PORT: '8080'
      MQTT_BROKER: lps-hivemq
      MQTT_PORT: '1883'
      MQTT_TOPIC: legacy-proxy-1-0/message
      SERVICE_NAME: legacy-proxy-1-0
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  legacy-proxy-2-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-2-0
    command: sh -c "mkdir -p logs; touch logs/legacy-proxy-2-0.log; tail -n 0 -F logs/legacy-proxy-2-0.log & exec python3 /scripts/legacy_proxy_2.py"
    environment:
      MQTT_HOST: lps-hivemq
      MQTT_PORT: '1883'
      SERVICE_NAME: legacy-proxy-2-0
      TARGET_URL: http://lps-consumer-server-proxy-0:9081/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  legacy-proxy-2-1:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-2-1
    command: sh -c "mkdir -p logs; touch logs/legacy-proxy-2-1.log; tail -n 0 -F logs/legacy-proxy-2-1.log & exec python3 /scripts/legacy_proxy_2.py"
    environment:
      MQTT_HOST: lps-hivemq
      MQTT_PORT: '1883'
      SERVICE_NAME: legacy-proxy-2-1
      TARGET_URL: http://lps-consumer-server-proxy-1:9081/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
    restart: unless-stopped
  mosquitto-init:
    image: busybox:latest
    container_name: lps-mosquitto-init
    command: sh -c "mkdir -p /mosquitto/config && echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && echo 'log_type all' >> /mosquitto/config/mosquitto.conf"
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount/mosquitto/config:/mosquitto/config
  scripts:
    image: jadkhaddad/lps-scripts:0.1.0
    container_name: lps-scripts
    command: sh -c 'python3 /scripts/latency.py server-results.json latency-line.png && python3 /scripts/failure.py device-results.json server-results.json failure.png'
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
  server:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server
    command: server --config-file /app/server-config.yaml
    environment:
      RUST_LOG: server=debug
    networks:
    - lps-net
    ports:
    - 0.0.0.0:8080:8080
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
  server-server-proxy-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server-server-proxy-0
    command: server-proxy --config-file /app/server-server-proxy-0.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
  validator:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-validator
    command: sh -c "validator --config-file /app/validator-config.yaml > /app/validator.log 2>&1"
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/simulations/lps/lps-iod/simulation-16/mount:/app
