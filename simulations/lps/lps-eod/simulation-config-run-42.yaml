devices:
  devices_count: 1
  max_event_interval: 100ms
  max_events: 1
  min_event_interval: 100ms
  retry_duration: 250ms
  wait_before_start: 3s
lps_gleam_image: jadkhaddad/lps-gleam:0.1.0
lps_mqtt_hivemq_image: jadkhaddad/lps-mqtt-hivemq:0.1.0
lps_mqtt_python_image: jadkhaddad/lps-mqtt-python:0.1.0
lps_rust_image: jadkhaddad/lps-rs:0.1.0
lps_scripts_image: jadkhaddad/lps-scripts:0.1.0
mqtt:
  consumers:
    consumers_count: 1
    mqtt_proxy:
      failure_rate: 0.0
      max_up_duration: 4s
      socket_addr: 0.0.0.0:9090
  producers:
    producers_count: 1
seed: 3
server:
  expose_socket_addr: 0.0.0.0:8080
  failure_rate: 0.0
  max_response_duration: 0ms
  max_work_duration: 5s
  server_count: 1
  shutdown_after_idle_duration: 5s
  socket_addr: 0.0.0.0:8080
simulation_dir: simulations/lps/lps-eod/simulation-42
simulation_docker_network: lps-simulation-net
