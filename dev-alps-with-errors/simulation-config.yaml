simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"

devices:
  devices_count: 50
  max_event_interval: 5s
  min_event_interval: 499ms
  max_events: 60
  retry_duration: 500ms

server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080
  failure_rate: 0.0
  shutdown_after_idle_duration: 30s
  server_count: 3
  use_gs_prod_workload: True 
  background_load_per_second: 70
  deduplication: True # Optional
  # deduplication_proxy: # Optional
  #   failure_rate: 0.1
  #   max_up_duration: 5s

amqp:
  queues_count: 3
  producers:
    producers_count: 3
    socket_addr: 0.0.0.0:5672
  consumers:
    consumers_count: 3
    reconnect_duration: 50ms
    amqp_proxy: # Optional, if not set, the consumer will connect directly to rabbitmq
      socket_addr: 0.0.0.0:9090
      failure_rate: 0.2
      max_up_duration: 909s
      min_up_duration: 227s
    server_proxy: # Optional, if not set, the consumer will connect directly to the server
      socket_addr: 0.0.0.0:9081
      failure_rate: 0.2
      # Median = 24.25 (Median processing time of an event = 16ms; shifted so ~20% of requests
      # fail while processing an event, i.e. P(up_duration < 16ms) = 0.2 for log-uniform sampling)
      max_up_duration: 48ms   # ~16 * 2^1.6, i.e. M * 2
      min_up_duration: 12ms   # M / 2