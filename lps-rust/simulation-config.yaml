simulation_dir_absolute_path: "/home/jadkhaddad/Desktop/LPS/lps-rust/simulation"
simulation_docker_network: "lps-simulation-net"
devices:
  devices_count: 10
  max_event_interval: 500ms
  retry_duration: 500ms
  max_events: 10 # Optional, if not set, the device will generate events indefinitely
server:
  server_domain: "server"
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080 # Optional, if set, the server will expose its socket on this address. If not set, it will be exposed on the same port as socket_addr.
  failure_rate: 0.1
  max_work_duration: 500ms
  max_response_duration: 100ms
  shutdown_after_idle_duration: 15s # Optional, if set, the server will shut down after being idle for this duration (no events received). If not set, the server will run indefinitely.
amqp:
  broker_domain: "rabbitmq"
  broker_port: 5672
  queues_count: 25
  producers:
    producers_count: 1
    socket_addr: 0.0.0.0:5672
    # amqp_proxy: # Optional, if not set, the producer will connect directly to rabbitmq
    #   socket_addr: 0.0.0.0:9090
    #   failure_rate: 0.0
    #   max_up_duration: 5s 
  consumers:
    consumers_count: 3
    reconnect_duration: 500ms
    # amqp_proxy: # Optional, if not set, the consumer will connect directly to rabbitmq
    #   socket_addr: 0.0.0.0:9090
    #   failure_rate: 0.1
    #   max_up_duration: 5s 
    # server_proxy: # Optional, if not set, the consumer will connect directly to the server
    #   socket_addr: 0.0.0.0:8080
    #   failure_rate: 0.1
    #   max_up_duration: 5s