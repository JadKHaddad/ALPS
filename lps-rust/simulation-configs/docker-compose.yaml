services:
  consumer-0:
    image: lps-rs:latest
    container_name: consumer-0
    command: consumer --config-file /app/consumer-0.yaml
    volumes:
    - ./mount:/app
    restart: unless-stopped
  consumer-1:
    image: lps-rs:latest
    container_name: consumer-1
    command: consumer --config-file /app/consumer-1.yaml
    volumes:
    - ./mount:/app
    restart: unless-stopped
  consumer-2:
    image: lps-rs:latest
    container_name: consumer-2
    command: consumer --config-file /app/consumer-2.yaml
    volumes:
    - ./mount:/app
    restart: unless-stopped
  device:
    image: lps-rs:latest
    container_name: lps-device
    command: device --config-file /app/device-config.yaml
    ports:
    - 0.0.0.0:5000:5000
    volumes:
    - ./mount:/app
  producer-0:
    image: lps-rs:latest
    container_name: producer-0
    command: producer --config-file /app/producer-0.yaml
    volumes:
    - ./mount:/app
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    command: bash -c " rabbitmq-plugins enable --offline rabbitmq_consistent_hash_exchange && rabbitmq-server "
    restart: unless-stopped
  scripts:
    image: lps-scripts:latest
    container_name: lps-scripts
    command: python /scripts/latency.py server-results.json latency.png
    profiles:
    - manual
    volumes:
    - ./mount:/app
  server:
    image: lps-rs:latest
    container_name: server
    command: server --config-file /app/server-config.yaml
    ports:
    - 0.0.0.0:8080:8080
    volumes:
    - ./mount:/app
  validator:
    image: lps-rs:latest
    container_name: lps-validator
    command: sh -c "validator --config-file /app/validator-config.yaml > /app/validator.log 2>&1"
    profiles:
    - manual
    volumes:
    - ./mount:/app
