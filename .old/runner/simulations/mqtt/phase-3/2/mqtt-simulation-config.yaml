simulation_dir: "simulation-mqtt"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"
lps_mqtt_python_image: "jadkhaddad/lps-mqtt-python:0.1.0"
lps_mqtt_hivemq_image: "jadkhaddad/lps-mqtt-hivemq:0.1.0"
devices:
  devices_count: 50
  max_event_interval: 500ms
  retry_duration: 500ms
  max_events: 50
server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080 # Optional, if set, the server will expose its socket on this address. If not set, it will be exposed on the same port as socket_addr.
  failure_rate: 0.0
  max_work_duration: 50ms
  max_response_duration: 50ms
  shutdown_after_idle_duration: 5s # Optional, if set, the server will shut down after being idle for this duration (no events received). If not set, the server will run indefinitely.
  # deduplication: True # Optional
  server_count: 1
mqtt:
  producers:
    producers_count: 3
  consumers:
    consumers_count: 3
    # mqtt_proxy: # Optional, if not set, the consumer will connect directly to hivemq
    #   socket_addr: 0.0.0.0:9090
    #   failure_rate: 0.1
    #   max_up_duration: 10s

# python /home/jadkhaddad/Desktop/LPS/scripts/latency.py server-results.json latency-line.png latency-hist.png 600000

# python3 runner.py --protocol "mqtt" --base-dir "simulations/mqtt/phase-3/2" --base-config "simulations/mqtt/phase-3/2/mqtt-simulation-config.yaml" --summary-file "simulations/mqtt/phase-3/2/simulation-summary.json"