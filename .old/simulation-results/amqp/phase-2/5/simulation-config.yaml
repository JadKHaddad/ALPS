simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"
devices:
  devices_count: 100
  max_event_interval: 500ms
  retry_duration: 500ms
  max_events: 100
server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080 # Optional, if set, the server will expose its socket on this address. If not set, it will be exposed on the same port as socket_addr.
  failure_rate: 0.0
  max_work_duration: 50ms
  max_response_duration: 50ms
  shutdown_after_idle_duration: 45s # Optional, if set, the server will shut down after being idle for this duration (no events received). If not set, the server will run indefinitely.
  deduplication: False # Optional
  server_count: 1
amqp:
  queues_count: 10
  producers:
    producers_count: 3
    socket_addr: 0.0.0.0:5672
  consumers:
    consumers_count: 9
    reconnect_duration: 500ms
    # amqp_proxy: # Optional, if not set, the consumer will connect directly to rabbitmq
    #   socket_addr: 0.0.0.0:9090
    #   failure_rate: 0.1
    #   max_up_duration: 10s 