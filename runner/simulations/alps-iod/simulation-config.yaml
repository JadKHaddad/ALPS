simulation_dir: "simulation"
simulation_docker_network: "lps-simulation-net"
lps_rust_image: "jadkhaddad/lps-rs:0.1.0"
lps_scripts_image: "jadkhaddad/lps-scripts:0.1.0"
lps_gleam_image: "jadkhaddad/lps-gleam:0.1.0"

devices:
  devices_count: 1
  max_event_interval: 100ms
  retry_duration: 250ms
  max_events: 2

server:
  socket_addr: 0.0.0.0:8080
  expose_socket_addr: 0.0.0.0:8080
  failure_rate: 0.0
  max_work_duration: 5s
  max_response_duration: 0ms
  shutdown_after_idle_duration: 5s
  server_count: 1
  deduplication: True

amqp:
  queues_count: 2
  producers:
    producers_count: 1
    socket_addr: 0.0.0.0:5672
  consumers:
    consumers_count: 2
    reconnect_duration: 500ms

# python3 runner.py --protocol "amqp" --runs 40 --base-dir "simulations/alps-iod" --base-config "simulations/alps-iod/simulation-config.yaml" --log-dir "simulations/alps-iod/logs"
# python3 runner.py --protocol "amqp" --start-index 41 --runs 59 --base-dir "simulations/alps-iod" --base-config "simulations/alps-iod/simulation-config.yaml" --log-dir "simulations/alps-iod/logs"