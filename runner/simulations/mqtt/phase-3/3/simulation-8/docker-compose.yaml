networks:
  lps-net:
    external: true
    name: lps-simulation-net
services:
  ars-comp-1-proxy-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-1-proxy-0
    command: python3 /scripts/ars_comp_1_proxy.py
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-1-proxy-0
      TARGET_URL: http://lps-legacy-proxy-1-0:8080/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  ars-comp-1-proxy-1:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-1-proxy-1
    command: python3 /scripts/ars_comp_1_proxy.py
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-1-proxy-1
      TARGET_URL: http://lps-legacy-proxy-1-1:8080/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  ars-comp-1-proxy-2:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-1-proxy-2
    command: python3 /scripts/ars_comp_1_proxy.py
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-1-proxy-2
      TARGET_URL: http://lps-legacy-proxy-1-2:8080/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  ars-comp-2-proxy:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-ars-comp-2-proxy
    command: python3 /scripts/ars_comp_2_proxy.py
    environment:
      HTTP_PORT: '8080'
      SERVICE_NAME: ars-comp-2-proxy
      TARGET_URL: http://lps-consumers-server-proxy:8080/work
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  consumers-server-proxy:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumers-server-proxy
    command: server-proxy --config-file /app/consumers-server-proxy-config.yaml
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
  device:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-device
    command: device --config-file /app/device-config.yaml
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
  hivemq:
    image: jadkhaddad/lps-mqtt-hivemq:0.1.0
    container_name: lps-hivemq
    networks:
    - lps-net
    restart: unless-stopped
  legacy-proxy-1-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-1-0
    command: python3 /scripts/legacy_proxy_1.py
    environment:
      HTTP_PORT: '8080'
      MQTT_BROKER: lps-hivemq
      MQTT_PORT: '1883'
      MQTT_TOPIC: proxy1/message
      SERVICE_NAME: legacy-proxy-1-0
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  legacy-proxy-1-1:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-1-1
    command: python3 /scripts/legacy_proxy_1.py
    environment:
      HTTP_PORT: '8080'
      MQTT_BROKER: lps-hivemq
      MQTT_PORT: '1883'
      MQTT_TOPIC: proxy1/message
      SERVICE_NAME: legacy-proxy-1-1
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  legacy-proxy-1-2:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-1-2
    command: python3 /scripts/legacy_proxy_1.py
    environment:
      HTTP_PORT: '8080'
      MQTT_BROKER: lps-hivemq
      MQTT_PORT: '1883'
      MQTT_TOPIC: proxy1/message
      SERVICE_NAME: legacy-proxy-1-2
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  legacy-proxy-2-0:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-2-0
    command: python3 /scripts/legacy_proxy_2.py
    environment:
      MQTT_HOST: lps-hivemq
      MQTT_PORT: '1883'
      SERVICE_NAME: legacy-proxy-2-0
      TARGET_URL: http://lps-ars-comp-2-proxy:8080/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  legacy-proxy-2-1:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-2-1
    command: python3 /scripts/legacy_proxy_2.py
    environment:
      MQTT_HOST: lps-hivemq
      MQTT_PORT: '1883'
      SERVICE_NAME: legacy-proxy-2-1
      TARGET_URL: http://lps-ars-comp-2-proxy:8080/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  legacy-proxy-2-2:
    image: jadkhaddad/lps-mqtt-python:0.1.0
    container_name: lps-legacy-proxy-2-2
    command: python3 /scripts/legacy_proxy_2.py
    environment:
      MQTT_HOST: lps-hivemq
      MQTT_PORT: '1883'
      SERVICE_NAME: legacy-proxy-2-2
      TARGET_URL: http://lps-ars-comp-2-proxy:8080/ID_REQ_KC_STORE7D3BPACKET
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
    restart: unless-stopped
  scripts:
    image: jadkhaddad/lps-scripts:0.1.0
    container_name: lps-scripts
    command: sh -c 'python3 /scripts/latency.py server-results.json latency-line.pdf && python3 /scripts/failure_order.py device-results.json server-results.json server-failures.json failure-order.pdf && python3 /scripts/failure_duplicate.py device-results.json server-results.json server-failures.json failure-duplicate.pdf'
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
  server:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server
    command: server --config-file /app/server-config.yaml
    environment:
      RUST_LOG: server=debug
    networks:
    - lps-net
    ports:
    - 0.0.0.0:8080:8080
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
  server-server-proxy-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server-server-proxy-0
    command: server-proxy --config-file /app/server-server-proxy-0.yaml
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
  validator:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-validator
    command: sh -c "validator --config-file /app/validator-config.yaml > /app/validator.log 2>&1"
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /opt/ALPS/runner/simulations/mqtt/phase-3/3/simulation-8/mount:/app
