    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-producer-1
    command: producer --config-file /app/producer-1.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/runner/simulations/amqp/phase-2/5/simulation-4/mount:/app
    restart: unless-stopped
  producer-2:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-producer-2
    command: producer --config-file /app/producer-2.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/runner/simulations/amqp/phase-2/5/simulation-4/mount:/app
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management
    container_name: lps-rabbitmq
    command: bash -c " rabbitmq-plugins enable --offline rabbitmq_consistent_hash_exchange && rabbitmq-server "
    networks:
    - lps-net
    restart: unless-stopped
  scripts:
    image: jadkhaddad/lps-scripts:0.1.0
    container_name: lps-scripts
    command: sh -c 'python3 /scripts/latency.py server-results.json latency-line.pdf && python3 /scripts/failure_order.py device-results.json server-results.json server-failures.json failure-order.pdf && python3 /scripts/failure_duplicate.py device-results.json server-results.json server-failures.json failure-duplicate.pdf'
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/runner/simulations/amqp/phase-2/5/simulation-4/mount:/app
  server:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server
    command: server --config-file /app/server-config.yaml
    environment:
      RUST_LOG: server=debug
    networks:
    - lps-net
    ports:
    - 0.0.0.0:8080:8080
    volumes:
    - /home/jadkhaddad/Desktop/LPS/runner/simulations/amqp/phase-2/5/simulation-4/mount:/app
  server-server-proxy-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-server-server-proxy-0
    command: server-proxy --config-file /app/server-server-proxy-0.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/runner/simulations/amqp/phase-2/5/simulation-4/mount:/app
  validator:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-validator
    command: sh -c "validator --config-file /app/validator-config.yaml > /app/validator.log 2>&1"
    profiles:
    - manual
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/runner/simulations/amqp/phase-2/5/simulation-4/mount:/app
