networks:
  lps-net:
    external: true
    name: lps-simulation-net
services:
  consumer-0:
    image: jadkhaddad/lps-rs:0.1.0
    container_name: lps-consumer-0
    command: consumer --config-file /app/consumer-0.yaml
    networks:
    - lps-net
    volumes:
    - /home/jadkhaddad/Desktop/LPS/runner/simulations/amqp/phase-2/5/simulation-4/mount:/app
    restart: unless-stopped
  consumer-1:
